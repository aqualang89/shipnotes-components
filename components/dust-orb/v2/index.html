<body><header><a class="brand" href="index.html">dust<span>by Ship Notes</span></a><button id="sound" aria-pressed="false">Sound off</button></header>
<main><dust-orb id="orb" aria-label="Dust, an interactive cloud with an ember inside"></dust-orb><div class="caption"><span id="state-label">A quiet presence.</span></div></main>
