<div id="root" data-start="0" data-duration="8" data-width="1080" data-height="1350" data-fps="60">
 <div class="backdrop" data-layout-ignore=""></div><div class="ambient" id="ambient" data-layout-ignore=""></div>
 <div class="mast"><span class="brand">SHIP NOTES</span><span class="edition">MOTION STUDY / 001</span></div>
 <h1 class="heading"><span>One click.</span><span class="quiet">Lift off.</span></h1>
 <div class="scene clip" id="scene" data-start="0" data-duration="8" data-track-index="0">
  <div class="machine" id="machine">
   <div class="ground" data-layout-ignore=""></div><div class="base"></div><div class="rim"><div class="bed"></div><div class="bed-light" id="bed-light"></div></div>
   <div class="rails" id="rails"></div>
   <div class="core" id="core"><div class="reactor-ring"></div><div class="reactor-ring middle" id="ring-middle"></div><div class="reactor-ring inner" id="ring-inner"></div><div class="heart" id="heart"></div><div class="launchmark"></div></div>
   <div class="beam-wide" id="beam-wide" data-layout-ignore=""></div><div class="beam" id="beam" data-layout-ignore=""></div>
   <div class="packet" id="packet" data-layout-ignore=""></div>
   <div class="ringwave" id="wave1" data-layout-ignore=""></div><div class="ringwave" id="wave2" data-layout-ignore=""></div>
   <div class="lid left" id="lid-left"><i class="seam"></i><i class="vent"></i><i class="screw"></i></div>
   <div class="lid right" id="lid-right"><i class="seam"></i><i class="vent"></i><i class="screw"></i></div>
   <div class="edge" id="edge" data-layout-ignore=""></div>

   <!-- Intentional label-on-lid layering, visually checked in proof frames. -->
   <div class="under" id="under"><span data-layout-allow-occlusion>READY TO LAUNCH</span><span data-layout-allow-occlusion>SN / 001</span></div>
   <div class="success" id="success"><svg viewBox="0 0 40 40"><path class="check-path" id="check-path" d="m7 20 8 8L33 11" /></svg><span>SHIPPED</span></div>
   <button class="hit" id="ship-trigger" type="button" aria-label="Play launch animation"></button>
  </div>
 </div>
 <div class="rail-info" id="rail-info"><span class="phase" id="phase">BUILDING</span><div class="progress-track"><div class="progress-value" id="progress-value"></div></div><span class="number" id="number">00</span></div>
 <div class="receipt" id="receipt"><span class="receipt-dot"></span><span>Out of your hands. Into the world.</span></div>

for(let i=0;i<18;i++){

 mote.style.left=(240+((i*71)%270))+'px';mote.style.top=(50+((i*37)%110))+'px';machine.append(mote);

<script>
// Demo-only behavior. The render composition stays paused and deterministic.
(() => {
  const root = document.getElementById('root');
  const button = document.getElementById('ship-trigger');
  const timeline = window.__timelines.main;
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const help = document.createElement('div');
  let busy = false;
  let reducedSuccess = false;
  document.body.classList.add('interactive');
  help.className = 'live-help';
  help.setAttribute('role', 'status');
  help.textContent = 'Click the switch. Space and Enter work too.';
  document.body.append(help);
  function fit() {
    const scale = Math.min(innerWidth / 1080, (innerHeight - 42) / 1350);
    Object.assign(root.style, {
      width: '1080px', height: '1350px', position: 'absolute',
      left: ((innerWidth - 1080 * scale) / 2) + 'px', top: '0',
      transformOrigin: '0 0', transform: `scale(${Math.max(.05, scale)})`,
    });
  }
  new ResizeObserver(fit).observe(document.body);
  fit();
  function ready() {
    busy = false;
    button.removeAttribute('aria-disabled');
    button.setAttribute('aria-label', 'Replay launch animation');
    help.textContent = 'Click to launch again. This is an animation, not a deployment.';
  }
  timeline.eventCallback('onComplete', ready);
  button.addEventListener('click', () => {
    if (busy) return;
    if (reducedMotion.matches) {
      reducedSuccess = !reducedSuccess;
      timeline.pause(reducedSuccess ? 5.5 : 0);
      button.setAttribute('aria-label', reducedSuccess ? 'Reset launch animation' : 'Play launch animation');
      help.textContent = reducedSuccess ? 'Shipped. Motion reduced to match your system setting.' : 'Click the switch.';
      return;
    }
    busy = true;
    button.setAttribute('aria-disabled', 'true');
    help.textContent = 'Launching...';
    timeline.pause(0);
    timeline.play(.92);
  });
})();

</script>
